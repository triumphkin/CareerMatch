[project]
name = "careermatch"
version = "0.1.0"
description = "Multi-agent job-search assistant with evidence-backed recommendations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "langgraph>=1.0.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "gradio>=5.0.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]