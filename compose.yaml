services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careermatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: careermatch
      POSTGRES_PASSWORD: careermatch
      POSTGRES_DB: careermatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "careermatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
